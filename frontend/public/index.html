      const toasts = document.getElementById('toasts');
      const toast = document.createElement('div');
      const borderClass = type === 'error' ? 'border-red-400 bg-red-50 text-red-900' : (type === 'info' ? 'border-blue-400 bg-blue-50 text-blue-900' : 'border-emerald-400 bg-emerald-50 text-emerald-900');

    function revokeKey(keyId) {
      const reason = prompt('Please enter a clinical or security reason for revocation:');
      if (!reason) return;
      state.keys = state.keys.filter(k => k.id !== keyId);
      state.activities.unshift({
        icon: 'slash',
        title: `Key revoked: ${reason}`,
        time: 'Just now',
        badge: 'Revoked'
      });
      saveState();
      showToast('Key Revoked', 'The hospital private key has been immediately invalidated.', 'error');
      render();
    }

    function generateKey(hospitalId) {
      const hosp = state.hospitals.find(h => h.id === hospitalId);
      if (!hosp) return;
      const keyIndex = `${hosp.code}-${Math.floor(1000 + Math.random() * 9000)}-${Math.random().toString(36).substring(2, 5).toUpperCase()}`;
      state.keys.push({
        id: 'k_' + Date.now(),
        hospitalId: hosp.id,
        hospitalName: hosp.name,
        keyIndex: keyIndex,
        ageDays: 0,
        expiresDays: 90,
        active: true
      });
      hosp.hasKey = true;
      state.activities.unshift({
        icon: 'key',
        title: `New private key created for ${hosp.name}`,
        time: 'Just now',
        badge: 'Key Generated'
      });
      saveState();
      showToast('New Key Generated', `Created key ${keyIndex} for ${hosp.name}. Saved in vault.`);
      closeModal();
      render();
    }

    function shareRecord(recordId) {
      const rec = state.records.find(r => r.id === recordId);
      if (!rec) return;
      rec.shared = !rec.shared;
      saveState();
      showToast(rec.shared ? t('grantConsent') : t('revoke'), rec.shared ? `Authorized read-only access for ${rec.title}` : `Revoked sharing permissions for ${rec.title}`, rec.shared ? 'success' : 'info');

    }

              <!-- Audited Requests -->
              <div class="bg-white rounded-2xl border border-gray-200/80 shadow-xs p-6">
                <h2 class="text-lg font-bold text-gray-900 mb-4">${t('auditedHistory')}</h2>
                <div class="divide-y divide-gray-100">
                  ${state.emergencyRequests.map(eq => `
                    <div class="py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                      <div>
                        <div class="flex items-center gap-3">
                          <span class="font-semibold text-gray-900">${eq.hospital}</span>
                          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">${eq.status}</span>
                        </div>
                        <p class="text-xs text-gray-600 mt-1"><strong>Doctor:</strong> ${eq.requester} • <strong>Reason:</strong> ${eq.reason}</p>
                        <p class="text-xs text-gray-400 mt-0.5">${eq.date}</p>
                      </div>
                      <div class="flex items-center gap-1.5 text-xs text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg">
                        <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                        ${t('patientNotified')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
      }
    }

    // --- Modal Functions ---
    function showConsentModal() {
      openModal(`
        <h3 class="text-xl font-bold text-gray-900 mb-2">${t('authorizeSharing')}</h3>
        <p class="text-xs text-gray-500 mb-4">Select target hospital and specify auto-expiration duration and scope.</p>

        <form onsubmit="handleConsentSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">${t('hospitals')}</label>
            <select id="consentHosp" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
              ${state.hospitals.map(h => `<option value="${h.name}">${h.name} (${h.city})</option>`).join('')}
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Consent Validity</label>
            <select id="consentDuration" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
              <option value="7">7 Days</option>
              <option value="30" selected>30 Days</option>
              <option value="90">90 Days</option>
              <option value="365">365 Days</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">${t('sharingScope')} (Read-Only)</label>
            <div class="space-y-2 text-xs text-gray-700">
              <label class="flex items-center gap-2"><input type="checkbox" checked class="rounded text-blue-600" /> Laboratory & Diagnostics</label>
              <label class="flex items-center gap-2"><input type="checkbox" checked class="rounded text-blue-600" /> Prescriptions & Medications</label>
              <label class="flex items-center gap-2"><input type="checkbox" checked class="rounded text-blue-600" /> Discharge Summaries</label>
            </div>
          </div>

          <div class="flex gap-2 pt-4">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 rounded-xl text-sm font-semibold">${t('cancel')}</button>
            <button type="submit" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700">${t('grantConsent')}</button>
          </div>
        </form>
      `);
    }

    function handleConsentSubmit(e) {
      e.preventDefault();
      const hosp = document.getElementById('consentHosp').value;
      const days = document.getElementById('consentDuration').value;

      state.activities.unshift({
        icon: 'share-2',
        title: `Granted ${days}-day read-only consent to ${hosp}`,
        time: 'Just now',
        badge: 'Consent'
      });
      saveState();
      showToast(t('grantConsent'), `Authorized ${hosp} for ${days} days read-only.`);
      closeModal();
      render();
    }

    function showGenerateKeyModal() {
      openModal(`
        <h3 class="text-xl font-bold text-gray-900 mb-2">${t('generateKey')}</h3>
        <p class="text-xs text-gray-500 mb-4">Create a new isolated key token for an authorized facility.</p>

        <div class="space-y-3">
          ${state.hospitals.map(h => `
            <div class="p-3 bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-between">
              <div>
                <div class="font-semibold text-gray-900 text-sm">${h.name}</div>
                <div class="text-xs text-gray-500">${h.city} • Code: ${h.code}</div>
              </div>
              <button onclick="generateKey('${h.id}')" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-700">
                ${t('generateKey')}
              </button>
            </div>
          `).join('')}
        </div>
      `);
    }

    function showEmergencyModal() {
      openModal(`
        <div class="flex items-center gap-3 text-red-600 mb-3">
          <i data-lucide="alert-triangle" class="w-6 h-6"></i>
          <h3 class="text-xl font-bold text-gray-900">${t('simulateEmergency')}</h3>
        </div>
        <p class="text-xs text-gray-500 mb-4">
          Emergency overrides require hospital identification, doctor credentials, and an urgent medical justification.
        </p>

        <form onsubmit="requestEmergencyAccess(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Requesting Hospital / Trauma Unit</label>
            <input id="emgHosp" type="text" required value="Metropolitan Trauma Center" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Attending Physician</label>
            <input id="emgDoctor" type="text" required value="Dr. Robert Hayes (Trauma Resident)" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Urgent Clinical Justification</label>
            <textarea id="emgReason" required rows="3" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-red-500">Unresponsive patient in ER following trauma collision. Immediate allergy and drug reaction record access required.</textarea>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 rounded-xl text-sm font-semibold">${t('cancel')}</button>
            <button type="submit" class="flex-1 py-2.5 bg-red-600 text-white rounded-xl text-sm font-semibold hover:bg-red-700 shadow-sm">${t('authorizeEmergency')}</button>
          </div>
        </form>
      `);
    }

    function showProfileModal() {
      openModal(`
        <h3 class="text-xl font-bold text-gray-900 mb-2">${t('myProfile')}</h3>
        <p class="text-xs text-gray-500 mb-4">Update your verified contact and emergency medical parameters.</p>

        <form onsubmit="handleProfileSubmit(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">${t('fullName')}</label>
            <input id="profName" type="text" required value="${state.user.fullName}" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">${t('age')}</label>
              <input id="profAge" type="number" required value="${state.user.age}" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">${t('bloodGroup')}</label>
              <input id="profBlood" type="text" required value="${state.user.bloodGroup}" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">${t('phone')}</label>
            <input id="profPhone" type="text" required value="${state.user.phone}" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">${t('emergencyContact')}</label>
            <input id="profEmergency" type="text" required value="${state.user.emergencyContact}" class="w-full px-3 py-2 border border-gray-300 rounded-xl text-sm" />
          </div>

          <div class="flex gap-2 pt-3">
            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 rounded-xl text-sm font-semibold">${t('cancel')}</button>
            <button type="submit" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700">${t('saveProfile')}</button>
          </div>
        </form>
      `);
    }

    function handleProfileSubmit(e) {
      e.preventDefault();
      state.user.fullName = document.getElementById('profName').value;
      state.user.age = parseInt(document.getElementById('profAge').value);
      state.user.bloodGroup = document.getElementById('profBlood').value;
      state.user.phone = document.getElementById('profPhone').value;
      state.user.emergencyContact = document.getElementById('profEmergency').value;
      saveState();
      showToast(t('saveProfile'), 'Your patient profile and emergency indicators have been updated.');
      closeModal();
      render();
    }

    // Initial render
    render();
  </script>
</body>
</html>
